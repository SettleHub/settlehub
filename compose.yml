services:
  settlehub:
    image: ghcr.io/settlehub/settlehub:latest
    container_name: settlehub
    restart: always
    ports:
      - "80:80"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m 

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
