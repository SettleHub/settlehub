services:
  settlehub:
    image: ghcr.io/settlehub/settlehub:latest
    container_name: settlehub
    restart: always
    ports:
      - "80:80"
    environment:
      - API_GATEWAY_PROTOCOL=${API_GATEWAY_PROTOCOL}
      - API_GATEWAY_ADDRESS=${API_GATEWAY_ADDRESS}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}

      - FRONTEND_ADDRESS=${FRONTEND_ADDRESS}
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m 

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
