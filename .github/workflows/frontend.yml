name: Frontend Production Pipeline

on:
  push:
    branches: [ "main", "demo" ]
  pull_request:
    branches: [ "main", "demo" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'latest'

jobs:
  ci:
    uses: ./.github/workflows/vue-ci.yml
    with:
      service-name: settlehub

  trufflehog:
    uses: ./.github/workflows/trufflehog.yml
    with:
      working-directory: ./
      service-name: settlehub
    secrets: inherit

  cd-publish:
    needs: [ci, trufflehog]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo')
    uses: ./.github/workflows/docker-cd.yml
    with:
      image-name: settlehub
    secrets: inherit

  deploy:
    needs: [cd-publish]
    runs-on: self-hosted
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy compose.yml to Target Machine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "compose.yml"
          target: "/opt/settlehub/frontend/"

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          VUE_APP_API_GATEWAY_PROTOCOL: ${{ vars.VUE_APP_API_GATEWAY_PROTOCOL }}
          VUE_APP_API_GATEWAY_ADDRESS: ${{ secrets.VUE_APP_API_GATEWAY_ADDRESS }}
          VUE_APP_API_GATEWAY_PORT: ${{ secrets.VUE_APP_API_GATEWAY_PORT }}
          VUE_APP_FRONTEND_ADDRESS: ${{ secrets.VUE_APP_FRONTEND_ADDRESS }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VUE_APP_API_GATEWAY_PROTOCOL,VUE_APP_API_GATEWAY_ADDRESS,VUE_APP_API_GATEWAY_PORT,VUE_APP_FRONTEND_ADDRESS
          script: |
            mkdir -p /opt/settlehub/frontend/
            cd /opt/settlehub/frontend/

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull
            
            docker compose up -d --force-recreate
            
            docker image prune -a -f --filter "until=24h"
