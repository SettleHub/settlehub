name: Reusable Docker CD

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string

jobs:
  docker-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/settlehub/${{ inputs.image-name }}:latest
