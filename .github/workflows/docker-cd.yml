name: Reusable Docker CD

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string

jobs:
  docker-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate .env for Vue build
        run: |
          echo "VUE_APP_API_GATEWAY_PROTOCOL=${{ vars.VUE_APP_API_GATEWAY_PROTOCOL }}" > .env
          echo "VUE_APP_API_GATEWAY_ADDRESS=${{ secrets.VUE_APP_API_GATEWAY_ADDRESS }}" >> .env
          echo "VUE_APP_API_GATEWAY_PORT=${{ secrets.VUE_APP_API_GATEWAY_PORT }}" >> .env
          echo "VUE_APP_FRONTEND_ADDRESS=${{ secrets.VUE_APP_FRONTEND_ADDRESS }}" >> .env

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/settlehub/${{ inputs.image-name }}:latest
